[package]
name = "kolibri"
version = "0.1.8"
description = "Kolibri - cliente multi-servicio"
authors = ["Debaq"]
edition = "2021"

[lib]
name = "kolibri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Engines nativos (Gmail/Outlook IMAP)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.9"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder"] }
futures-util = "0.3"
oauth2 = "4"
tiny_http = "0.12"
async-trait = "0.1"
keyring = "3"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Misma versión exacta que usa wry-0.54.3 internamente. Necesario para pasar
# `webkit2gtk::WebView` a `WebviewBuilder::with_related_view` y compartir un
# único WebKitWebProcess entre el bar y todos los servicios.
webkit2gtk = "=2.0.2"

# Vendoreamos wry para deshabilitar PSON (Process Swap On Navigation) y permitir
# que múltiples webviews compartan un único WebProcess en Linux/WebKitGTK.
[patch.crates-io]
wry = { path = "../vendor/wry" }
